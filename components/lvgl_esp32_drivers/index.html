<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>LittleVGL Screen</title>
</head>

<script language="javascript" type="text/javascript">

var canvas;
var context;
var imageData;
var width;
var height;

var websocket;
var ws_connected;

var pointerDown;
var canvas_left;
var canvas_top;

function init() {
	canvas = document.getElementById("canvas");
	context = canvas.getContext("2d")
	width = canvas.width;
	height = canvas.height;
	
	pointerDown = false;
	const rect = canvas.getBoundingClientRect();
	canvas_left = rect.left;
	canvas_top = rect.top;
	if (window.PointerEvent) {
		canvas.addEventListener('pointerdown', onPointerDown);
		canvas.addEventListener('pointermove', onPointerMove);
		canvas.addEventListener('pointerup', onPointerUp);
		canvas.addEventListener('pointerleave', onPointerUp);
		canvas.addEventListener('pointercancel', onPointerUp);
	} else {
		canvas.addEventListener('mousedown', onPointerDown);
		canvas.addEventListener('mousemove', onPointerMove);
		canvas.addEventListener('mouseup', onPointerUp);
		canvas.addEventListener('mouseleave', onPointerUp);
	}

	ws_connected = false;
	wsConnect();
}

function wsConnect() {
	websocket = new WebSocket('ws://'+location.hostname+'/');
	websocket.binaryType = "arraybuffer";
	websocket.onopen = function(evt) { onOpen(evt) };
	websocket.onclose = function(evt) { onClose(evt) };
	websocket.onmessage = function(evt) { onMessage(evt) };
	websocket.onerror = function(evt) { onError(evt) };
}

function wsSend(state, x, y) {
	if (ws_connected) {
		var mouse_packet = new Uint8Array(5);
		
		mouse_packet[0] = state;
		mouse_packet[1] = (x >> 8) & 0xFF;
		mouse_packet[2] = x & 0xFF;
		mouse_packet[3] = (y >> 8) & 0xFF;
		mouse_packet[4] = y & 0xFF;
		
		websocket.send(mouse_packet);
	}
}

function onOpen(evt) {
	console.log("Connected");
	ws_connected = true;
}

function onClose(evt) {
	console.log("Disconnected");
	ws_connected = false;
	setTimeout(function() { wsConnect() }, 2000);
}

function onMessage(evt) {
	var buffer = evt.data;
	var header = new Uint8Array(buffer, 0, 13);
	var pixels = new Uint8Array(buffer, 13);
	var pixel_depth = header[0];
	var w  = (header[1] << 8) | header[2];
	var h  = (header[3] << 8) | header[4];
	var x1 = (header[5] << 8) | header[6];
	var y1 = (header[7] << 8) | header[8];
	var x2 = (header[9] << 8) | header[10];
	var y2 = (header[11] << 8) | header[12];
	var pixelIndex = 0;
	
	if ((w != width) || (h != height)) {
		canvas.width = w;
		canvas.height = h;
		width = w;
		height = h;
		
		context.fillStyle = "black";
		context.fillRect(0, 0, width, height);
		imageData = context.getImageData(0, 0, width, height);
	}

	if (pixel_depth == 16) {
		for (var y=y1; y<=y2; y++) {
			for (var x=x1; x<=x2; x++) {
				var canvasIndex = (y * width + x) * 4;
				var c16 = (pixels[pixelIndex++] << 8) | pixels[pixelIndex++];
				imageData.data[canvasIndex    ] = (c16 & 0xF800) >> 8;
				imageData.data[canvasIndex + 1] = (c16 & 0x07E0) >> 3;
				imageData.data[canvasIndex + 2] = (c16 & 0x001F) << 3;
				imageData.data[canvasIndex + 3] = 255;
			}
		}
	} else if (pixel_depth == 8){
		for (var y=y1; y<=y2; y++) {
			for (var x=x1; x<=x2; x++) {
				var canvasIndex = (y * width + x) * 4;
				var c8 = pixels[pixelIndex++];
				imageData.data[canvasIndex    ] = ((c8 & 0xE0)>>5) * 36.428;
        imageData.data[canvasIndex + 1] = ((c8 & 0x1C)>>2) * 36.428;
        imageData.data[canvasIndex + 2] = (c8 & 0x03) * 85;
        imageData.data[canvasIndex + 3] = 255;
			}
		}
	} else if (pixel_depth == 4){
    for (var y=y1; y<=y2; y++) {
			for (var x=x1; x<=x2; x++) {
				var canvasIndex = (y * width + x) * 4;
        var c8 = pixels[Math.floor(pixelIndex/2)];
        if((pixelIndex & 1) == 0) { 
          imageData.data[canvasIndex    ] = (c8 & 0x80)?255:0;
          imageData.data[canvasIndex + 1] = ((c8 & 0x60)>>5)*85;
          imageData.data[canvasIndex + 2] = (c8 & 0x10)?255:0;
          imageData.data[canvasIndex + 3] = 255;
        } else {
          imageData.data[canvasIndex    ] = (c8 & 0x08)?255:0;
          imageData.data[canvasIndex + 1] = ((c8 & 0x06)>>1)*85;
          imageData.data[canvasIndex + 2] = (c8 & 0x01)?255:0;
          imageData.data[canvasIndex + 3] = 255;
        }
        pixelIndex++;
			}
		}
  } else if (pixel_depth == 132){
    for (var y=y1; y<=y2; y++) {
			for (var x=x1; x<=x2; x++) {
				var canvasIndex = (y * width + x) * 4;
        var c8 = pixels[Math.floor(pixelIndex/2)];
        if((pixelIndex & 1) == 0) { 
          var pix = ((c8 & 0xF0)>>4) * 17;
          imageData.data[canvasIndex    ] = pix;
          imageData.data[canvasIndex + 1] = pix;
          imageData.data[canvasIndex + 2] = pix;
          imageData.data[canvasIndex + 3] = 255;
        } else {
          var pix = (c8 & 0x0F) * 17;
          imageData.data[canvasIndex    ] = pix;
          imageData.data[canvasIndex + 1] = pix;
          imageData.data[canvasIndex + 2] = pix;
          imageData.data[canvasIndex + 3] = 255;
        }
        pixelIndex++;
			}
		}
	} else if (pixel_depth == 130){
    for (var y=y1; y<=y2; y++) {
			for (var x=x1; x<=x2; x++) {
				var canvasIndex = (y * width + x) * 4;
        var c8 = pixels[Math.floor(pixelIndex/4)];
        if((pixelIndex & 3) == 0) { 
          var pix = ((c8 & 0xC0)>>6) * 85;
          imageData.data[canvasIndex    ] = pix;
          imageData.data[canvasIndex + 1] = pix;
          imageData.data[canvasIndex + 2] = pix;
          imageData.data[canvasIndex + 3] = 255;
        } else if((pixelIndex & 3) == 1) { 
          var pix = ((c8 & 0x30)>>4) * 85;
          imageData.data[canvasIndex    ] = pix;
          imageData.data[canvasIndex + 1] = pix;
          imageData.data[canvasIndex + 2] = pix;
          imageData.data[canvasIndex + 3] = 255;
        } else if((pixelIndex & 3) == 2) { 
          var pix = ((c8 & 0x0C)>>2) * 85;
          imageData.data[canvasIndex    ] = pix;
          imageData.data[canvasIndex + 1] = pix;
          imageData.data[canvasIndex + 2] = pix;
          imageData.data[canvasIndex + 3] = 255;
        } else  { 
          var pix = (c8 & 0x03) * 85;
          imageData.data[canvasIndex    ] = pix;
          imageData.data[canvasIndex + 1] = pix;
          imageData.data[canvasIndex + 2] = pix;
          imageData.data[canvasIndex + 3] = 255;
        }
        pixelIndex++;
			}
		}
	}
	context.putImageData(imageData, 0, 0);
}

function onError(evt) {
    console.log("ERROR: " + evt);
}

function onPointerDown(evt) {
	pointerDown = true;
	var x = evt.clientX - canvas_left;
	var y = evt.clientY - canvas_top;
	wsSend(1, x, y);
}

function onPointerMove(evt) {
	if (pointerDown) {
		evt.preventDefault();
		var x = evt.clientX - canvas_left;
		var y = evt.clientY - canvas_top;
		wsSend(1, x, y);
	}
}

function onPointerUp(evt) {
	pointerDown = false;
	var x = evt.clientX - canvas_left;
	var y = evt.clientY - canvas_top;
	wsSend(0, x, y);
}

window.addEventListener("load", init, false);
</script>

<body>
	<canvas id="canvas" width="1" height="1"></canvas>
</body>
</html>
